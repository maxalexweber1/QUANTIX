[project]
name = "charli3-bridge"
version = "0.1.0"
description = "Bridge exposing Charli3 C3AS feeds via REST + triggering ODV updates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "blockfrost-python>=0.6",
  "cbor2>=5.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["charli3_bridge*"]
